name: Publish iPhone web app

# Builds the installable web app and publishes it to GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Read the Pages address
        id: pages
        uses: actions/configure-pages@v6

      - name: Build the web app
        run: npm run build:web
        env:
          CI: 1
          EXPO_OFFLINE: 1
          WEB_BASE_URL: ${{ steps.pages.outputs.base_path }}
          WEB_APP_URL: ${{ steps.pages.outputs.base_url }}/

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
