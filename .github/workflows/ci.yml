name: Quality checks

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run quality gates
        run: npm run check

      - name: Verify the Android bundle compiles
        run: npx expo export --platform android --output-dir /tmp/export-android
        env:
          CI: 1
          EXPO_OFFLINE: 1

      - name: Verify the web app builds
        run: npm run build:web
        env:
          CI: 1
          EXPO_OFFLINE: 1
          WEB_BASE_URL: /pocket-ledger
